services:
  uptime-kuma:
    image: louislam/uptime-kuma:${VERSION}
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${PATH1}:/app/data 
    environment:
      - TZ=Europe/Budapest 
      - UMASK=0022 
    networks:
      - proxy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptimekuma.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.uptimekuma.entrypoints=websecure
      - traefik.http.routers.uptimekuma.tls.certresolver=myresolver
      - traefik.http.services.uptimekuma.loadbalancer.server.port=3001
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3001
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy-network:
    external: true
